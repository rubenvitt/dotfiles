# AeroSpace — i3-artiger Tiling-Window-Manager für macOS (kein SIP-Abschalten nötig).
# Doku: https://nikitabobko.github.io/AeroSpace/guide
#
# Symlink: ~/.config/aerospace/aerospace.toml -> ~/.dotfiles/aerospace/aerospace.toml
#
# Modifier-Konzept (deutsche Tastatur!):
#   Ctrl+Alt          — fokussieren / Workspace wechseln
#   Ctrl+Alt+Shift    — Fenster mitnehmen
# Alt allein ist auf DE-Layout tabu: Option+7/8/9/5/6 erzeugen | { } [ ],
# Option+←/→ springt wortweise, Option+Shift+←/→ markiert wortweise.
# Die nativen macOS-Space-Shortcuts (Ctrl+←/→) sind in mac-setup.sh deaktiviert,
# weil AeroSpace die Workspace-Navigation übernimmt.

config-version = 2

start-at-login = true
auto-reload-config = true

# Weder JankyBorders noch die Bar hier starten: mbar.app läuft als
# Anmeldeobjekt (dev.rubeen.mbar), startet die Bar und führt
# ~/.config/borders/bordersrc selbst aus. Ein zweiter Start würde nur eine
# zweite Instanz bzw. eine Fehlermeldung erzeugen.

# Normalisierung: verschachtelte Container automatisch aufräumen.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
# 'auto': breite Monitore horizontal, hohe vertikal.
default-root-container-orientation = 'auto'

# Maus folgt dem Fokus, wenn der Monitor wechselt.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

focus-follows-mouse.enabled = false

# Tastennamen beziehen sich auf die physische QWERTY-Position, nicht auf das
# aktive Layout. Diese Config nutzt nur Pfeile, Ziffern und Buchstaben —
# damit ist die Layout-Frage irrelevant.
key-mapping.preset = 'qwerty'

# Nur die Workspaces, die auch gebunden sind. S1-S3 gehören dem virtuellen
# Screensharing-Monitor; persistent, damit AeroSpace ihm S1 gibt, statt einen
# Workspace "10" anzulegen.
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'S1', 'S2', 'S3']

# Abstände. outer.top ist monitorabhängig. Die macOS-Menüleiste bleibt
# eingeblendet (39 pt), die 40 pt hohe Bar liegt darüber (topmost=on): Bei
# ausgeblendeter Leiste fängt macOS 27 Klicks in den oberen 39 pt ab, und die
# Bar-Items reagieren erst beim zweiten Klick.
#   built-in: der Notch-Bereich zählt ohnehin nicht zur nutzbaren Fläche,
#             die Bar liegt komplett darin → nur der normale 8er-Rand.
#   extern:   die nutzbare Fläche beginnt unter der Menüleiste (39), also
#             40 - 39 + 8 = 9, sonst verschwinden die Fenster hinter der Bar.
# Der letzte Eintrag der Liste ist der Default für alle übrigen Monitore.
gaps.inner.horizontal = 8
gaps.inner.vertical   = 8
gaps.outer.left       = 8
gaps.outer.bottom     = 8
gaps.outer.top        = [{ monitor.'built-in' = 8 }, 9]
gaps.outer.right      = 8

# Workspace- und Modus-Wechsel meldet mbar selbst an die Bar
# (aerospace_workspace_change / aerospace_mode_change, siehe items/spaces.lua
# und items/aerospace_mode.lua). Keine exec-on-workspace-change- oder
# on-mode-changed-Trigger mehr: die geforkten Trigger kämen 10-50 ms später an
# und könnten mbars Event mit einem älteren Zustand überschreiben.

# Fenster, die nicht gekachelt werden sollen.
# Bedingungen in der test-Syntax (`man aerospace-test`); die alte
# `if.app-id`-Form ist deprecated.
# Feste Workspace-Verteilung auf zwei Monitore: 1-5 links, 6-9 rechts.
# Die Zahl ist die Sequenznummer von links nach rechts, nicht die Display-ID --
# bei zwei baugleichen PA279CRV taugt der Monitorname nicht als Muster, und
# 'secondary' ist nur fuer den Zwei-Monitor-Fall definiert.
# Am Schreibtisch laeuft der Laptop im Clamshell-Modus, unterwegs gibt es nur
# einen Monitor: fehlt der zugewiesene, landet der Workspace auf dem
# Hauptmonitor (mit einer Zuweisung auf einen nicht existierenden Monitor
# gegengeprueft) — unterwegs bleiben also alle neun erreichbar.
# Achtung: ctrl-alt-shift-tab (move-workspace-to-monitor) ist fuer die
# Workspaces 1-9 damit wirkungslos, eine Zuweisung schlaegt den Befehl.
# Wer den Befehl behalten will, nimmt die betreffenden Zeilen hier raus.
# Dritter Monitor zum Screensharing (BetterDisplay "Virtuell 16:9"): Er bekommt
# eigene Workspaces S1-S3, per Name zugewiesen. Er muss in der Anordnung rechts
# der beiden PA279CRV stehen, sonst verschieben sich die Sequenznummern 1/2.
# Ohne ihn landen S1-S3 auf Monitor 1 (links), als Reserve neben 1-5.
# App-Workspaces M (Mail), C (Chat), P (Player), erreichbar über die Hyper-Taste
# (Moonlander, rechter Daumen). C und P sind fest rechts; M entsteht auf dem
# Monitor, der beim ersten Fenster fokussiert ist.
[workspace-to-monitor-force-assignment]
1 = 1
2 = 1
3 = 1
4 = 1
5 = 1
6 = 2
7 = 2
8 = 2
9 = 2
S1 = ['^Virtuell', 1]
S2 = ['^Virtuell', 1]
S3 = ['^Virtuell', 1]
C = 2
P = 2

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.systempreferences'
run = ['layout floating']

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.ActivityMonitor'
run = ['layout floating']

# Parallels: VM-Fenster bleiben schwebend, damit Aerospace sie nicht kachelt
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.parallels.desktop.console'
run = ['layout floating']

# Raycast: Kommandopalette und Detailfenster nie kacheln
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.raycast.macos'
run = ['layout floating']

# App-Workspaces. Die Regeln greifen nur beim Öffnen eines Fensters; danach
# lässt es sich wie jedes andere mit ctrl-alt-shift-<n> verschieben.
# Mail: hinterher, sonst verschwindet ein neues Fenster (Cmd+N,
# mailto-Link) von dem Workspace, auf dem man gerade arbeitet.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.mail || test %{app-bundle-id} = com.fastmail.mac.Fastmail'
run = ['move-node-to-workspace M', 'workspace M']

# Chat ohne hinterher, und Meetings/Huddles bleiben, wo sie aufgehen.
# shortcut: die Meeting-Titel sind geraten; geht ein Meeting-Fenster doch auf
# C auf, im Meeting den Titel mit `aerospace list-windows --all` nachsehen.
[[on-window-detected]]
if = '(test %{app-bundle-id} = com.microsoft.teams2 || test %{app-bundle-id} = com.tinyspeck.slackmacgap) && test-not %{window-title} ~= "Besprechung|Meeting|Anruf|Call|Huddle"'
run = 'move-node-to-workspace C'

# Medien ohne hinterher: Musik starten, weiterarbeiten.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.spotify.client || test %{app-bundle-id} = com.apple.Music || test %{app-bundle-id} = com.apple.podcasts'
run = 'move-node-to-workspace P'

# ── Haupt-Modus ─────────────────────────────────────────────────────────────
[mode.main.binding]

    # Fokus bewegen
    ctrl-alt-left  = 'focus left'
    ctrl-alt-down  = 'focus down'
    ctrl-alt-up    = 'focus up'
    ctrl-alt-right = 'focus right'

    # Fenster verschieben
    ctrl-alt-shift-left  = 'move left'
    ctrl-alt-shift-down  = 'move down'
    ctrl-alt-shift-up    = 'move up'
    ctrl-alt-shift-right = 'move right'

    # Workspace fokussieren
    ctrl-alt-1 = 'workspace 1'
    ctrl-alt-2 = 'workspace 2'
    ctrl-alt-3 = 'workspace 3'
    ctrl-alt-4 = 'workspace 4'
    ctrl-alt-5 = 'workspace 5'
    ctrl-alt-6 = 'workspace 6'
    ctrl-alt-7 = 'workspace 7'
    ctrl-alt-8 = 'workspace 8'
    ctrl-alt-9 = 'workspace 9'
    # Screensharing-Workspaces; minus/equal sind auf DE-Layout ß und ´
    ctrl-alt-0     = 'workspace S1'
    ctrl-alt-minus = 'workspace S2'
    ctrl-alt-equal = 'workspace S3'
    ctrl-alt-q     = 'workspace S3'   # Split-Tastatur ohne ´-Taste
    # Hyper wechselt wie ctrl-alt, zusätzlich auf die App-Workspaces.
    # Z/Y meiden: AeroSpace meint die QWERTY-Position.
    cmd-ctrl-alt-shift-m = 'workspace M'
    cmd-ctrl-alt-shift-c = 'workspace C'
    cmd-ctrl-alt-shift-p = 'workspace P'
    cmd-ctrl-alt-shift-1 = 'workspace 1'
    cmd-ctrl-alt-shift-2 = 'workspace 2'
    cmd-ctrl-alt-shift-3 = 'workspace 3'
    cmd-ctrl-alt-shift-4 = 'workspace 4'
    cmd-ctrl-alt-shift-5 = 'workspace 5'
    cmd-ctrl-alt-shift-6 = 'workspace 6'
    cmd-ctrl-alt-shift-7 = 'workspace 7'
    cmd-ctrl-alt-shift-8 = 'workspace 8'
    cmd-ctrl-alt-shift-9 = 'workspace 9'
    cmd-ctrl-alt-shift-0 = 'workspace S1'

    # Fenster auf Workspace verschieben (und mitgehen)
    ctrl-alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
    ctrl-alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
    ctrl-alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
    ctrl-alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
    ctrl-alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
    ctrl-alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
    ctrl-alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
    ctrl-alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
    ctrl-alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
    ctrl-alt-shift-0     = ['move-node-to-workspace S1', 'workspace S1']
    ctrl-alt-shift-minus = ['move-node-to-workspace S2', 'workspace S2']
    ctrl-alt-shift-equal = ['move-node-to-workspace S3', 'workspace S3']
    ctrl-alt-shift-q     = ['move-node-to-workspace S3', 'workspace S3']

    # Zuletzt genutzter Workspace / Workspace auf anderen Monitor
    ctrl-alt-tab       = 'workspace-back-and-forth'
    ctrl-alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Layout
    ctrl-alt-e     = 'layout tiles horizontal vertical'    # Split-Richtung umschalten
    ctrl-alt-w     = 'layout accordion horizontal vertical'
    ctrl-alt-f     = 'fullscreen'
    ctrl-alt-space = 'layout floating tiling'              # Fenster schweben lassen

    # Modi
    ctrl-alt-shift-r = 'mode resize'   # nicht ctrl-alt-r: in IntelliJ belegt
    ctrl-alt-s = 'mode service'

# ── Resize-Modus (Ctrl+Alt+Shift+R, verlassen mit Esc/Enter) ──────────────────────
[mode.resize.binding]
    left  = 'resize width +50'
    right = 'resize width -50'
    up    = 'resize height +50'
    down  = 'resize height -50'
    b     = 'balance-sizes'
    esc   = 'mode main'
    enter = 'mode main'

# ── Service-Modus (Ctrl+Alt+S) ──────────────────────────────────────────────
[mode.service.binding]
    esc       = ['reload-config', 'mode main']
    r         = ['flatten-workspace-tree', 'mode main']   # Layout zurücksetzen
    f         = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    # Fenster auf die App-Workspaces schieben (und mitgehen). Hier statt
    # ctrl-alt-shift-<Buchstabe>, weil das mit App-Shortcuts kollidieren kann
    # (JetBrains: ctrl-alt-shift-c = Copy Reference).
    m = ['move-node-to-workspace M', 'workspace M', 'mode main']
    c = ['move-node-to-workspace C', 'workspace C', 'mode main']
    p = ['move-node-to-workspace P', 'workspace P', 'mode main']

    left  = ['join-with left', 'mode main']
    down  = ['join-with down', 'mode main']
    up    = ['join-with up', 'mode main']
    right = ['join-with right', 'mode main']
