# AeroSpace — i3-artiger Tiling-Window-Manager für macOS (kein SIP-Abschalten nötig).
# Doku: https://nikitabobko.github.io/AeroSpace/guide
#
# Symlink: ~/.config/aerospace/aerospace.toml -> ~/.dotfiles/aerospace/aerospace.toml
#
# Modifier-Konzept (deutsche Tastatur!):
#   Ctrl+Alt          — fokussieren / Workspace wechseln
#   Ctrl+Alt+Shift    — Fenster mitnehmen
# Alt allein ist auf DE-Layout tabu: Option+7/8/9/5/6 erzeugen | { } [ ],
# Option+←/→ springt wortweise, Option+Shift+←/→ markiert wortweise.
# Die nativen macOS-Space-Shortcuts (Ctrl+←/→) sind in mac-setup.sh deaktiviert,
# weil AeroSpace die Workspace-Navigation übernimmt.

config-version = 2

start-at-login = true
auto-reload-config = true

# JankyBorders mitstarten — es erkennt eine bereits laufende Instanz selbst.
# Sketchybar NICHT hier starten: es läuft als brew-service
# (`brew services start felixkratz/formulae/sketchybar`) und würde sonst
# als zweite Bar-Instanz hochkommen.
after-startup-command = ['exec-and-forget /opt/homebrew/bin/borders']

# Normalisierung: verschachtelte Container automatisch aufräumen.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
# 'auto': breite Monitore horizontal, hohe vertikal.
default-root-container-orientation = 'auto'

# Maus folgt dem Fokus, wenn der Monitor wechselt.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

focus-follows-mouse.enabled = false

# Tastennamen beziehen sich auf die physische QWERTY-Position, nicht auf das
# aktive Layout. Diese Config nutzt nur Pfeile, Ziffern und Buchstaben —
# damit ist die Layout-Frage irrelevant.
key-mapping.preset = 'qwerty'

# Nur die Workspaces, die auch gebunden sind.
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

# Abstände. outer.top ist monitorabhängig, weil die macOS-Menüleiste
# ausgeblendet ist (_HIHideMenuBar) und der nutzbare Bereich damit direkt
# am oberen Rand beginnt:
#   built-in: der Notch-Bereich zählt ohnehin nicht zur nutzbaren Fläche,
#             die 40px hohe Sketchybar liegt komplett darin → nur der
#             normale 8er-Rand.
#   extern:   dort gibt es keinen Notch, also Bar-Höhe (40) + 8 = 48,
#             sonst verschwinden die Fenster hinter der Sketchybar.
# Der letzte Eintrag der Liste ist der Default für alle übrigen Monitore.
gaps.inner.horizontal = 8
gaps.inner.vertical   = 8
gaps.outer.left       = 8
gaps.outer.bottom     = 8
gaps.outer.top        = [{ monitor.'built-in' = 8 }, 48]
gaps.outer.right      = 8

# Sketchybar über den Workspace-Wechsel informieren.
# items/spaces.lua hört auf dieses Custom-Event.
exec-on-workspace-change = ['/bin/bash', '-c',
    '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Sketchybar über den Wechsel des Binding-Modus informieren.
# items/aerospace_mode.lua hört auf dieses Custom-Event.
# AeroSpace stellt im Callback keine Variable mit dem neuen Modus bereit
# (per env-Dump geprüft), deshalb die Abfrage — zum Callback-Zeitpunkt ist
# der Wechsel bereits übernommen.
on-mode-changed = ['exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=$(/opt/homebrew/bin/aerospace list-modes --current)']

# Fenster, die nicht gekachelt werden sollen.
# Bedingungen in der test-Syntax (`man aerospace-test`); die alte
# `if.app-id`-Form ist deprecated.
# Feste Workspace-Verteilung auf zwei Monitore: 1-5 links, 6-9 rechts.
# Die Zahl ist die Sequenznummer von links nach rechts, nicht die Display-ID --
# bei zwei baugleichen PA279CRV taugt der Monitorname nicht als Muster, und
# 'secondary' ist nur fuer den Zwei-Monitor-Fall definiert.
# Am Schreibtisch laeuft der Laptop im Clamshell-Modus, unterwegs gibt es nur
# einen Monitor: fehlt der zugewiesene, landet der Workspace auf dem
# Hauptmonitor (mit einer Zuweisung auf einen nicht existierenden Monitor
# gegengeprueft) — unterwegs bleiben also alle neun erreichbar.
# Achtung: ctrl-alt-shift-tab (move-workspace-to-monitor) ist fuer die
# Workspaces 1-9 damit wirkungslos, eine Zuweisung schlaegt den Befehl.
# Wer den Befehl behalten will, nimmt die betreffenden Zeilen hier raus.
[workspace-to-monitor-force-assignment]
1 = 1
2 = 1
3 = 1
4 = 1
5 = 1
6 = 2
7 = 2
8 = 2
9 = 2

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.systempreferences'
run = ['layout floating']

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.ActivityMonitor'
run = ['layout floating']

# Parallels: VM-Fenster bleiben schwebend, damit Aerospace sie nicht kachelt
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.parallels.desktop.console'
run = ['layout floating']

# Raycast: Kommandopalette und Detailfenster nie kacheln
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.raycast.macos'
run = ['layout floating']

# ── Haupt-Modus ─────────────────────────────────────────────────────────────
[mode.main.binding]

    # Fokus bewegen
    ctrl-alt-left  = 'focus left'
    ctrl-alt-down  = 'focus down'
    ctrl-alt-up    = 'focus up'
    ctrl-alt-right = 'focus right'

    # Fenster verschieben
    ctrl-alt-shift-left  = 'move left'
    ctrl-alt-shift-down  = 'move down'
    ctrl-alt-shift-up    = 'move up'
    ctrl-alt-shift-right = 'move right'

    # Workspace fokussieren
    ctrl-alt-1 = 'workspace 1'
    ctrl-alt-2 = 'workspace 2'
    ctrl-alt-3 = 'workspace 3'
    ctrl-alt-4 = 'workspace 4'
    ctrl-alt-5 = 'workspace 5'
    ctrl-alt-6 = 'workspace 6'
    ctrl-alt-7 = 'workspace 7'
    ctrl-alt-8 = 'workspace 8'
    ctrl-alt-9 = 'workspace 9'

    # Fenster auf Workspace verschieben (und mitgehen)
    ctrl-alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
    ctrl-alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
    ctrl-alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
    ctrl-alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
    ctrl-alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
    ctrl-alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
    ctrl-alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
    ctrl-alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
    ctrl-alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']

    # Zuletzt genutzter Workspace / Workspace auf anderen Monitor
    ctrl-alt-tab       = 'workspace-back-and-forth'
    ctrl-alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Layout
    ctrl-alt-e     = 'layout tiles horizontal vertical'    # Split-Richtung umschalten
    ctrl-alt-w     = 'layout accordion horizontal vertical'
    ctrl-alt-f     = 'fullscreen'
    ctrl-alt-space = 'layout floating tiling'              # Fenster schweben lassen

    # Modi
    ctrl-alt-shift-r = 'mode resize'   # nicht ctrl-alt-r: in IntelliJ belegt
    ctrl-alt-s = 'mode service'

# ── Resize-Modus (Ctrl+Alt+Shift+R, verlassen mit Esc/Enter) ──────────────────────
[mode.resize.binding]
    left  = 'resize width +50'
    right = 'resize width -50'
    up    = 'resize height +50'
    down  = 'resize height -50'
    b     = 'balance-sizes'
    esc   = 'mode main'
    enter = 'mode main'

# ── Service-Modus (Ctrl+Alt+S) ──────────────────────────────────────────────
[mode.service.binding]
    esc       = ['reload-config', 'mode main']
    r         = ['flatten-workspace-tree', 'mode main']   # Layout zurücksetzen
    f         = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    left  = ['join-with left', 'mode main']
    down  = ['join-with down', 'mode main']
    up    = ['join-with up', 'mode main']
    right = ['join-with right', 'mode main']
